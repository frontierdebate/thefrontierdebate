name: Morning draft

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC every day
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: debate
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write today's draft
        run: node scripts/draft.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save draft to the repository
        run: |
          git config user.name "debate-bot"
          git config user.email "debate-bot@users.noreply.github.com"
          git add -A data moderator
          git diff --cached --quiet || git commit -m "Draft written [skip ci]"
          git push
